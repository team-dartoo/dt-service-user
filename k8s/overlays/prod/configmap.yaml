apiVersion: v1
kind: ConfigMap
metadata:
  name: dt-user-config
  labels:
    app: dt-user
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: dartoo
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: dt-user
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: dt-service-user
  SPRING_PROFILES_ACTIVE: product
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_SHUTDOWN_TIMEOUT: 90s
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_TIME_ZONE: UTC
  SPRING_JACKSON_TIME_ZONE: UTC
  DB_URL: jdbc:postgresql://db-svc:5432/dartoo
  HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  NOTIFICATION_SERVICE_BASE_URL: "http://dt-notification-svc:8000"
  SECURITY_LOG_LEVEL: "INFO"
  APP_LOG_LEVEL: "INFO"
  CORS_ALLOWED_ORIGINS: "https://dartoo.co.kr,https://api.dartoo.co.kr,https://www.dartoo.co.kr"
