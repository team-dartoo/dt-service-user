server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dt-service-user}
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      format_sql: true
      hibernate.jdbc.time_zone: ${SPRING_JPA_HIBERNATE_TIME_ZONE:UTC}
  jackson:
    time-zone: ${SPRING_JACKSON_TIME_ZONE:UTC}
  security:
    oauth2:
      client:
        registration:
          naver:
            provider: naver
            client-id: ${OAUTH_NAVER_CLIENT_ID}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET}
            scope: [name, email, gender, birthday, birthyear]
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
          kakao:
            provider: kakao
            client-id: ${OAUTH_KAKAO_CLIENT_ID}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}
            scope: [profile_nickname, account_email]
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
          google:
            provider: google
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            scope: [profile, email, https://www.googleapis.com/auth/user.birthday.read, https://www.googleapis.com/auth/user.gender.read]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response # 계정을 식별할 때의 링크 응답의 1차 식별자
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

app:
  jwt:
    issuer: "Dartoo"
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    refresh-pepper: ${JWT_REFRESH_PEPPER}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900} # 15분
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600} # 14일
  oauth:
    # 이 소셜 계정을 기존 DB의 어떤 이메일 계정에 붙여야 하는지
    # 결정할 때만 쓰는 짧은 수명의 링크 토큰용 키
    link-secret: ${OAUTH_LINK_SECRET}
    link-ttl-seconds: ${OAUTH_LINK_TTL_SECONDS:900} # 5분
    link-cookie-name: "oauth-link-token-dartoo"
    issuer: "Dartoo"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000} # CORS 허용 URL을 설정

# Actuator 설정 - Health endpoint를 인증 없이 접근 가능하도록 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL}
    org.springframework.web: ${APP_LOG_LEVEL}
    dartoo.accountService: ${APP_LOG_LEVEL}